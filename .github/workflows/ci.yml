name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests (generator + validator)
        run: python3 -m unittest discover tests -v

      - name: Example lesson builds clean and is not stale
        run: |
          python3 build.py examples/oauth-authorization-code/lesson.json \
            --template template.html \
            --output examples/oauth-authorization-code/lesson.html \
            --check

      - name: Template self-test is not stale
        run: python3 build.py template.html --check
